<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash Facts Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <span class="badge">БЕСПОЛЕЗНО</span>
                <div class="counter">Wasted: <span id="sec">0</span>с</div>
            </div>
            
            <div class="content">
                <p id="fact">Нажми на кнопку, чтобы деградировать...</p>
            </div>

            <button id="next-btn">ПОЛУЧИТЬ ПОРЦИЮ БРЕДА</button>
        </div>
    </div>
        <script src="script.js"></script>
    <div class="stats" style="margin: 15px 0; font-size: 0.8rem; color: rgba(255,255,255,0.7);">
    <p>Всего фраз: <span id="total-phrases">0</span></p>
    <p>Собрано слов: <span id="total-words">0</span></p>
    </div>
</body>
</html>
